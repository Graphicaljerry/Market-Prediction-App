# Cloudflare Worker config for the Git-connected deploy.
# IMPORTANT: set `name` to EXACTLY the Worker name you created in the dashboard,
# otherwise the build deploys a *different* worker and your secrets/URL won't line up.
name = "market-prediction-app"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-06-20"

# 24/7 auto-tracker: every 15 min the Worker computes a pick from FREE data only
# (Kalshi price + Coinbase candles + order book — no LLM call, no AI spend) and grades
# the previous round. Read it at  <worker-url>/?picks=ETH . Stays within the free tier.
[triggers]
# */15        = the 24/7 pick / grade / learn loop (unchanged).
# 12,27,42,57 = ~3 min before each close: the Sure-Thing near-lock scanner that pings you to bet
#               (worker.js scanLateLocks). Read-only on Kalshi crowd odds; adds no KV writes.
crons = ["*/15 * * * *", "12,27,42,57 * * * *"]

# Public Kalshi 15-min series tickers (not secret). Kept here so Git deploys don't
# wipe them — plain-text dashboard variables get reset on every Worker build.
[vars]
KALSHI_SERIES_ETH = "KXETH15M"
KALSHI_SERIES_BTC = "KXBTC15M"
KALSHI_SERIES_SOL = "KXSOL15M"
# The four new coins. Best-guess tickers (Kalshi's KX<SYM>15M pattern). VERIFY each at
# <worker-url>/?discover=DOGE  (then XRP / HYPE / BNB) and fix any whose crowd shows n/a.
KALSHI_SERIES_DOGE = "KXDOGE15M"
KALSHI_SERIES_XRP = "KXXRP15M"
KALSHI_SERIES_HYPE = "KXHYPE15M"
KALSHI_SERIES_BNB = "KXBNB15M"

# Cross-isolate cache for Kalshi crowd odds. Kalshi rate-limits Cloudflare's shared
# egress IPs (429s), so we persist each good fetch here and serve it (even when stale)
# through the throttled gaps. One success is shared across every Worker instance.
[[kv_namespaces]]
binding = "CROWD_KV"
id = "fc9c4d13092c4e96956659aa427c2ec6"
