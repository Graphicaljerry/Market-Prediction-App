# Temporary audit helper: pulls the tracker's recorded rounds from the Worker
# (current per-coin state + every permanent daily archive) and commits them to
# this branch under data-audit/. Manual trigger only; safe to delete after use.
name: fetch-tracker-data
on:
  workflow_dispatch:
  push:
    branches: [claude/prediction-market-app-review-bfkk10]
    paths: ['.github/workflows/fetch-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch worker exports
        run: |
          W="https://market-prediction-app.jrodsuniverse.workers.dev"
          mkdir -p data-audit/arch
          curl -sS --retry 3 "$W/?picks" -o data-audit/picks-all.json
          curl -sS --retry 3 "$W/?archive" -o data-audit/days.json
          cat data-audit/days.json
          for d in $(python3 -c "import json;print(' '.join(json.load(open('data-audit/days.json')).get('days',[])))"); do
            curl -sS --retry 3 "$W/?archive=$d" -o "data-audit/arch/$d.json"
            sleep 1
          done
          ls -la data-audit/arch | tail -5
      - name: Commit results
        run: |
          git config user.name "tracker-data-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add data-audit
          git commit -m "data: worker export for accuracy audit (temporary)" || echo "nothing to commit"
          git push
