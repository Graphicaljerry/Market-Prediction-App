name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp eth-tracker.html _site/index.html
          cp eth-tracker.html _site/eth-tracker.html
          cp guide.html _site/guide.html
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # This deploy died for days on "Failed to CreateArtifact: Artifact storage quota has been
          # hit" (runs #264-#265, 2026-09-11). The build was green; the upload had nowhere to land, so
          # nothing was ever published and the live site silently sat on an old build. That quota is
          # ACCOUNT-wide across PRIVATE repos; the repo is public now, which takes Actions storage out
          # of the quota entirely. Keep this anyway: Pages only needs the artifact long enough for the
          # deploy step on the very next line, and a 1-day life means a future private fork can never
          # wedge itself the same way.
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
