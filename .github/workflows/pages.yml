name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp eth-tracker.html _site/index.html
          cp eth-tracker.html _site/eth-tracker.html
          cp guide.html _site/guide.html
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # This deploy died for days on "Failed to CreateArtifact: Artifact storage quota has been
          # hit" (run #264, 2026-09-11). The build was fine; the upload had nowhere to go, so nothing
          # was ever published and the live site sat on an old build. The quota is ACCOUNT-wide across
          # private repos, so keep each run's footprint short-lived: Pages only needs the artifact
          # long enough for the deploy step that immediately follows it.
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
