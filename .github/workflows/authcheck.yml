# Temporary: verifies the Kalshi API key is working, from a runner that can reach the Worker.
# Prints ONLY the safe fields (never the key, never the account reply). Delete after use.
name: kalshi-authcheck
on:
  workflow_dispatch:
  push:
    branches: [claude/prediction-market-app-review-bfkk10]
    paths: ['.github/workflows/authcheck.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Worker whether the key signs successfully
        run: |
          curl -sS --retry 3 "https://market-prediction-app.jrodsuniverse.workers.dev/?authcheck" -o r.json
          python3 - <<'PY'
          import json
          d = json.load(open('r.json'))
          # Redact: 'reply' echoes Kalshi's response body (the account balance on success).
          safe = {k: v for k, v in d.items() if k != 'reply'}
          print(json.dumps(safe, indent=2))
          PY
      - name: Crowd coverage right now (did it improve?)
        run: |
          for c in ETH BTC SOL; do
            echo "--- $c ---"
            curl -sS --retry 2 "https://market-prediction-app.jrodsuniverse.workers.dev/?crowd=$c" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ['coin','httpStatus','openMarkets','overPct','strike']})"
          done
